[package]
name = "data-builder"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
shared = { path = "../shared" }
repak = { git = "https://github.com/trumank/repak", features = ["oodle"] }
texture2ddecoder = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
